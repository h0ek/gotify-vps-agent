name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GO_VERSION: 1.26.7
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Validate tag
        run: '[[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Validate source
        run: |
          test -z "$(gofmt -l $(find . -name '*.go' -type f))"
          go run mvdan.cc/sh/v3/cmd/shfmt@v3.13.1 -d scripts/*.sh
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          go vet ./...
          go test -race -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          make build-release VERSION="${VERSION#v}" COMMIT="${COMMIT}"
          ./scripts/package-release.sh "${VERSION#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/gotify-vps-agent_*_linux_amd64.tar.gz \
            dist/gotify-vps-agent_*_linux_arm64.tar.gz \
            dist/checksums.txt \
            dist/install.sh \
            --verify-tag \
            --generate-notes \
            --title "Gotify VPS Agent ${GITHUB_REF_NAME}"
